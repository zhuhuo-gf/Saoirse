<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    html, body {
      margin: 0; padding: 0;
      background: transparent;
      overflow: hidden;
      user-select: none;
      cursor: grab;
    }
    #pet-wrap {
      width: 220px; height: 210px;
      position: relative;
    }
    #bubble {
      position: absolute; top: 2px; left: 50%;
      transform: translateX(-50%);
      background: rgba(7, 20, 38, .94); color: #f5fbff;
      padding: 9px 14px; border-radius: 14px;
      font-size: 14px; line-height: 1.5;
      width: max-content;
      max-width: 200px;
      white-space: normal;
      word-break: break-word;
      text-align: center;
      display: none;
      border: 1px solid rgba(120, 231, 246, .48);
      box-shadow: 0 8px 24px rgba(0,0,0,.34), 0 0 18px rgba(120,231,246,.12);
      font-family: "Segoe UI Variable Text", "Microsoft YaHei UI", sans-serif;
      z-index: 2;
    }
    #bubble.show { display: block; animation: pop .18s ease-out; }
    #pet {
      position: absolute; bottom: 4px; left: 50%;
      transform: translateX(-50%);
      height: 158px;
      pointer-events: none;
    }
    #pet.animate-bob { animation: bob 3.2s ease-in-out infinite; }
    @keyframes bob {
      0%, 100% { transform: translateX(-50%) translateY(0); }
      50% { transform: translateX(-50%) translateY(-7px); }
    }
    @keyframes pop {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
  </style>
</head>
<body>
  <div id="pet-wrap">
    <div id="bubble"></div>
    <img id="pet" draggable="false" alt="">
  </div>
  <script src="pet.js"></script>
</body>
</html>
